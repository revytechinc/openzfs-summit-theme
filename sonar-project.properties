# SonarQube settings for this repository.
#
# This is a WordPress theme, and the WordPress Coding Standards require two
# things SonarQube's default PHP profile flags on every file:
#   php:S100  function names in camelCase  -> WPCS requires prefixed snake_case
#             (ozs_*, zfs_*), because WordPress has one global function namespace
#   php:S105  no tab characters            -> WPCS requires tab indentation
# Only these two rules are switched off, and only for PHP.
sonar.issue.ignore.multicriteria=wpcsnames,wpcstabs
sonar.issue.ignore.multicriteria.wpcsnames.ruleKey=php:S100
sonar.issue.ignore.multicriteria.wpcsnames.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wpcstabs.ruleKey=php:S105
sonar.issue.ignore.multicriteria.wpcstabs.resourceKey=**/*.php
